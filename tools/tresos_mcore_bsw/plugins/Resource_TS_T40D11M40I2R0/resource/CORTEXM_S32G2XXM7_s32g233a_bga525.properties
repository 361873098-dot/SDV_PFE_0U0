# Thermal.DefaultTempValues: Default calibration values for the measured temperature corresponding to the sensor values
# Thermal.TmuConfigSet.TmuHwUnit.MonitoringSitePlacement: Tmu temperature sensor placements
# Thermal.HasSeparatedIrq: Tmu separated critical interrupt ID is not available
################################################################################

