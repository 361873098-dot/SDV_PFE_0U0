#
# Fls.Sector.Physical.List    :list of available Flash physical sectors
#
################################################################################

Fls.Sector.Physical.List: 1000_FLS_EXT_SECTOR

#Maximum index of each type of sector, used to check constraints
Fls.NumberOfSectorData: 0
Fls.NumberOfSectorCode: 0

# Internal Flash does not exist
Fls.FlsAcErase.Default: 0x00000000
Fls.FlsAcWrite.Default: 0x00000000

Fls.DataFlashExists:false
Fls.ECCSyndrome:0
Fls.ECCSyndromeCache:0

#Fls.UserModeSupport : Paramater to determine platform support run FLS driver in User Mode or not
#       - true : Support running FLS driver in User Mode
#       - false: Not support running FLS driver in User Mode
#
Fls.UserModeSupport: true
Fls.SupportSynchronizeCacheFeature: false
Fls.SupportMultiCoreFeature: true
Fls.FlsUseInterrupts: true

Fls.External.Qspi.Header: S32G274A_QUADSPI.h
Fls.External.Qspi.Available:STD_ON
Fls.External.HwUnit.List:FLS_QSPI_0

# AHB master ID max.
Fls.External.Qspi.Ahb.MasterID.Size: 63

# Maximum size of AHB Buffer in bytes of QSPI
Fls.External.Qspi.Ahb.Buffer.Size: 1024

# Minimum entries of 4 bytes fill needed to allow Tx operation to start.
Fls.External.Qspi.Tx.Buffer.Fill: 1

# Maximum size of TX Buffer in bytes of QSPI
Fls.External.Qspi.Tx.Buffer.Size: 1024

# Maximum size of RX Buffer in bytes of QSPI
Fls.External.Qspi.Rx.Buffer.Size: 256

# Number of LUT registers that make up a LUT sequence
Fls.External.Qspi.LutSequence.Size: 5

#List of QSPI hardware instances that support side B
Fls.External.HwUnitSupportSideB.List: FLS_QSPI_0

# Listed in QuadSPI chapter, each one has a QSPI_BUFxCR register associated. Used to store read data when using AHB read mode.
Fls.External.HwUnit.Ahb.Buffers:AHB_BUFFER_0,AHB_BUFFER_1,AHB_BUFFER_2,AHB_BUFFER_3

#The instruction type used to identify the command used by the QSPI IP when sending the command to the memory.
Fls.External.LUT.Instruction.List:     QSPI_IP_LUT_INSTR_CMD,\
                                  QSPI_IP_LUT_INSTR_ADDR,\
                                  QSPI_IP_LUT_INSTR_DUMMY,\
                                  QSPI_IP_LUT_INSTR_MODE,\
                                  QSPI_IP_LUT_INSTR_MODE2,\
                                  QSPI_IP_LUT_INSTR_MODE4,\
                                  QSPI_IP_LUT_INSTR_READ,\
                                  QSPI_IP_LUT_INSTR_WRITE,\
                                  QSPI_IP_LUT_INSTR_JMP_ON_CS,\
                                  QSPI_IP_LUT_INSTR_ADDR_DDR,\
                                  QSPI_IP_LUT_INSTR_MODE_DDR,\
                                  QSPI_IP_LUT_INSTR_MODE2_DDR,\
                                  QSPI_IP_LUT_INSTR_MODE4_DDR,\
                                  QSPI_IP_LUT_INSTR_READ_DDR,\
                                  QSPI_IP_LUT_INSTR_WRITE_DDR,\
                                  QSPI_IP_LUT_INSTR_DATA_LEARN,\
                                  QSPI_IP_LUT_INSTR_CMD_DDR,\
                                  QSPI_IP_LUT_INSTR_CADDR,\
                                  QSPI_IP_LUT_INSTR_CADDR_DDR,\
                                  QSPI_IP_LUT_INSTR_STOP

# Number of pads/pins used for the current command.
Fls.External.LUT.Pad.List:          QSPI_IP_LUT_PADS_1, \
                                    QSPI_IP_LUT_PADS_2, \
                                    QSPI_IP_LUT_PADS_4, \
                                    QSPI_IP_LUT_PADS_8

#
Fls.HwUnit.Channel.List:      FLS_CH_QSPI

# The hardware unit read mode: single data rate or double data rate
Fls.HwUnit.ReadMode.List:   QSPI_IP_DATA_RATE_SDR,\
                            QSPI_IP_DATA_RATE_DDR
# If default value is true then it's fixed
Fls.HwUnit.DqsMode.Default:   false

#Selects the write mode: IP write or AHB write
Fls.HwUnit.WriteMode.List:  FLS_IP_WRITE_MODE,\
                            FLS_AHB_WRITE_MODE

# DQS clocks for sampling read data at Flash A QuadSPI port
Fls.HwUnit.Sampling.ModeA.List: QSPI_IP_READ_MODE_LOOPBACK, \
                                QSPI_IP_READ_MODE_EXTERNAL_DQS

# DQS clocks for sampling read data at Flash B QuadSPI port
Fls.HwUnit.Sampling.ModeB.List: QSPI_IP_READ_MODE_LOOPBACK, \
                                QSPI_IP_READ_MODE_EXTERNAL_DQS

# Choose the mode of DLL feature for flash A
Fls.HwUnit.Dll.ModeA.List: QSPI_IP_DLL_BYPASSED, \
                           QSPI_IP_DLL_MANUAL_UPDATE, \
                           QSPI_IP_DLL_AUTO_UPDATE

# Choose the mode of DLL feature for flash B
Fls.HwUnit.Dll.ModeB.List: QSPI_IP_DLL_BYPASSED, \
                           QSPI_IP_DLL_MANUAL_UPDATE, \
                           QSPI_IP_DLL_AUTO_UPDATE

Fls.Qspi.Channel.List:      FLS_CH_EXTERN_QSPI_0_A1,\
                            FLS_CH_EXTERN_QSPI_0_A2,\
                            FLS_CH_EXTERN_QSPI_0_B1,\
                            FLS_CH_EXTERN_QSPI_0_B2,\
                            FLS_CH_EXTERN_QSPI_0_PARALLEL_A1B1,\
                            FLS_CH_EXTERN_QSPI_0_PARALLEL_A2B2,\
                            NOT_QSPI_CHANNEL

# Supports hyperflash
Fls.Qspi.Hyperflash.Available: 1

# Supports secure flash protection feature
Fls.Qspi.Has.Sfp: 0

# Minimum delay, in CPU cycles, between Tx FIFO reset and Tx FIFO push 
Fls.Qspi.TxDelay:430

# Minimum delay, in CPU cycles, after changing the value of the software reset bits
Fls.Qspi.SwResetDelay:276

# Default register values, device specific. If a register is not available, the value should be set to zero.
