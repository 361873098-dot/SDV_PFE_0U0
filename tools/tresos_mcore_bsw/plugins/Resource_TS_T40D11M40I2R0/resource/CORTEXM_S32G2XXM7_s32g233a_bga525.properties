# Thermal.TmuCfgDacTrim.Shift: Tmu DAC Trim shift,index0->Trim0,index1->Trim1
# Thermal.TmuCfgDacTrim.ValidMask: Tmu DAC Trim valid mask to select the valid bit from fuse value
# Thermal.TmuCfgDacTrim.DataMask: Tmu DAC Trim mask to select the data bits from the fuse value
# Thermal.TmuCfgDacTrim.SignMask: The Mask of CFG_DAC_TRIM sign bit.
# Thermal.MaxTempAvailable: Maximum measurable temperature in Kelvin
# Thermal.MinTempAvailable: Minimum measurable temperature in Kelvin
# Thermal.DefaultCalibPointCount: The number of default calibration points
# Thermal.SensorDacTrimIndex: index to add the trim values, 0->CFG_DAC_TRIM_0, 1->CFG_DAC_TRIM_1, 2->don't have DAC trim
